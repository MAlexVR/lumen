[package]
name = "lumen-pluralsight"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
lumen-core.workspace = true
lumen-download.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "time"] }
url = "2"

[dev-dependencies]
lumen-download = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "macros"] }
tempfile.workspace = true

[lints]
workspace = true
