name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual run. Set `windows: true` to also run the Windows job.
  workflow_dispatch:
    inputs:
      windows:
        description: Also run the Windows job
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev \
            libxdo-dev libssl-dev build-essential pkg-config

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # The UI build must exist before cargo: tauri::generate_context! embeds ui/dist.
      - name: Build UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm check
          pnpm build

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # Windows minutes cost 2x on private repositories, so this job never runs on
  # push or pull_request. Windows is validated manually at milestones: trigger
  # this workflow by hand with `windows: true`. It only checks and tests; there
  # is deliberately no installer or bundle step here.
  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test
        run: cargo test --workspace
